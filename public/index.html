<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tool Map</title>
<meta name="description" content="Nazar's tool library: dev, AI and design tools, linked by what works together.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cline x1='9' y1='9' x2='23' y2='16' stroke='%231f6f5c' stroke-width='2.5'/%3E%3Cline x1='9' y1='23' x2='23' y2='16' stroke='%231f6f5c' stroke-width='2.5'/%3E%3Ccircle cx='9' cy='9' r='5' fill='%236a4fc4'/%3E%3Ccircle cx='9' cy='23' r='5' fill='%23d07a1f'/%3E%3Ccircle cx='23' cy='16' r='6' fill='%232f6fb8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a workbench — the constellation of tools fills the left, a spec sheet for the picked tool sits on the right (stacks below on phones). */
:root {
  --bg: #eef0ec; --panel: #f8f9f6; --fg: #1c2420; --muted: #5d6862; --line: #d3d8d2;
  --edge: #8a958f; --edge-alt: #b4705a; --accent: #1f6f5c; --on-node: #ffffff; --logo-bg: #ffffff;
  --c1: #6a4fc4; --c2: #c2456b; --c3: #2f6fb8; --c4: #2e8a57; --c5: #d07a1f; --c6: #5b6770;
  --c7: #b04aa6; --c8: #8a5a3b; --c9: #b58a00; --c10: #178a8a; --c11: #7a7f3a; --c12: #7d8580;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131815; --panel: #1a201c; --fg: #e4e9e5; --muted: #98a39c; --line: #2c3530;
    --edge: #6d7a73; --edge-alt: #d98c70; --accent: #5cc4a6; --on-node: #0f1311; --logo-bg: #f4f6f3;
    --c1: #9b84ee; --c2: #ef7a9b; --c3: #6aa6ec; --c4: #5cc48a; --c5: #f0a24e; --c6: #9aa7b0;
    --c7: #dc7fd2; --c8: #c9926b; --c9: #e3bb3a; --c10: #4fc4c4; --c11: #b4ba63; --c12: #a9b1ac;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body);
  padding-inline: max(16px, env(safe-area-inset-left)); padding-block: max(20px, env(safe-area-inset-top)) 28px; }
.wrap { max-width: 1280px; margin-inline: auto; display: grid; gap: 14px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
h1 { font: 700 clamp(26px, 4vw, 36px)/1.05 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.status { display: flex; align-items: center; gap: 10px; font: 12px/1.3 var(--font-mono); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.live { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.dot.warn { background: var(--edge-alt); }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 10px; font: 500 12px var(--font-mono); }
.btn:hover { border-color: var(--edge); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 200px; max-width: 280px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 7px 11px; font: 14px var(--font-body); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 13px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.chip[aria-pressed="true"] { background: var(--panel); border-color: var(--fg); font-weight: 600; }
.chip .n { font: 11px var(--font-mono); color: var(--muted); }

.bench { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; }
.stage { position: relative; border: 1px solid var(--line); border-radius: 12px; background:
  radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--panel);
  height: clamp(440px, 72vh, 780px); overflow: hidden; min-width: 0; }
#graph { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#graph:active { cursor: grabbing; }
.legend { position: absolute; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; font: 11px var(--font-mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }

.node { cursor: pointer; }
.node .ring { stroke-width: 3.5; fill: var(--logo-bg); }
.node .mono { font: 600 12px var(--font-mono); fill: var(--fg); pointer-events: none; text-anchor: middle; dominant-baseline: central; }
.node .lbl { font: 500 12.5px var(--font-body); fill: var(--fg); pointer-events: none; text-anchor: middle; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.node.sel .halo { stroke: var(--fg); stroke-width: 2; fill: none; }
.node .halo { fill: none; stroke: none; }
.node image { pointer-events: none; }
.link { stroke: var(--edge); stroke-width: 1.6; fill: none; }
.link.alt { stroke: var(--edge-alt); stroke-dasharray: 5 5; }
.dim { opacity: .14; }
.node, .link { transition: opacity .2s; }
.hidden-cat { display: none; }

aside { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; align-self: start; }
.head { display: flex; gap: 12px; align-items: center; }
.head img, .head .em { width: 44px; height: 44px; border-radius: 10px; background: var(--logo-bg); border: 1px solid var(--line); object-fit: contain; padding: 4px; flex: none; display: grid; place-items: center; font-size: 24px; }
.cat-tag { display: inline-flex; align-items: center; gap: 7px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.cat-tag i { width: 10px; height: 10px; border-radius: 3px; display: block; }
aside h2 { font: 700 26px/1.1 var(--font-display); letter-spacing: -0.01em; margin: 2px 0 0; overflow-wrap: anywhere; }
aside p { margin: 0; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font: 500 11.5px var(--font-mono); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px 16px; }
.links a { color: var(--accent); font-weight: 600; text-decoration: none; }
.links a:hover { text-decoration: underline; }
.rel h3 { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.rel ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.rel li button { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 9px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.rel li button:hover { border-color: var(--fg); }
.rel li i { width: 8px; height: 8px; border-radius: 50%; display: block; }
.none { color: var(--muted); font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

@media (max-width: 820px) {
  .bench { grid-template-columns: minmax(0, 1fr); }
  .stage { height: clamp(380px, 62vh, 560px); }
}
@media (prefers-reduced-motion: reduce) { .node, .link { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Tool Map</h1>
      <p class="sub"><span id="count">Loading tools…</span> Linked by what works together and what can replace what.</p>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span><span id="statusText">Loading from Notion…</span>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="controls">
    <input class="search" id="search" type="search" placeholder="Find a tool…" aria-label="Find a tool">
    <div class="chips" id="chips"></div>
  </div>

  <div class="bench">
    <div class="stage">
      <svg id="graph" role="img" aria-label="Graph of tools and their connections"></svg>
      <div class="zoom">
        <button class="btn" type="button" id="zin" aria-label="Zoom in">+</button>
        <button class="btn" type="button" id="zout" aria-label="Zoom out">−</button>
        <button class="btn" type="button" id="zfit">Fit</button>
      </div>
      <div class="legend">
        <span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" class="link"/></svg>works with</span>
        <span><svg width="22" height="6" aria-hidden="true"><line x1="0" y1="3" x2="22" y2="3" class="link alt"/></svg>alternative to</span>
      </div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
